<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Items - Lost & Found</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body onload="loadMyItems()">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-box-open mr-2"></i>Lost & Found</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="report-lost.html">Report Lost</a></li>
                    <li class="nav-item"><a class="nav-link" href="report-found.html">Report Found</a></li>
                    <li class="nav-item"><a class="nav-link" href="search.html">Search Items</a></li>
                    <li class="nav-item"><a class="nav-link" href="matches.html">Matches</a></li>
                </ul>
                <ul class="navbar-nav" id="authNav"></ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="font-weight-bold text-primary"><i class="fas fa-list border-bottom"></i> My Reported Items</h2>
                <p class="text-muted">Manage the items you have reported. You can request a status change when an item is claimed or returned.</p>
            </div>
        </div>

        <!-- My Lost Items -->
        <h4 class="mb-3 text-danger"><i class="fas fa-search-minus"></i> My Lost Items</h4>
        <div class="row" id="myLostItemsContainer">
            <div class="col-12 text-center text-muted mt-2">
                <div class="spinner-border text-danger" role="status"></div>
            </div>
        </div>

        <hr class="my-5">

        <!-- My Found Items -->
        <h4 class="mb-3 text-success"><i class="fas fa-search-plus"></i> My Found Items</h4>
        <div class="row" id="myFoundItemsContainer">
            <div class="col-12 text-center text-muted mt-2">
                <div class="spinner-border text-success" role="status"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=5"></script>
</body>

</html>
