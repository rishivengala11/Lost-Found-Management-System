<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Items - Lost & Found</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body
    onload="const urlParams = new URLSearchParams(window.location.search); if(urlParams.get('type')) { document.getElementById('filterType').value = urlParams.get('type'); } searchItems();">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-box-open mr-2"></i>Lost & Found</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="report-lost.html">Report Lost</a></li>
                    <li class="nav-item"><a class="nav-link" href="report-found.html">Report Found</a></li>
                    <li class="nav-item active"><a class="nav-link" href="search.html">Search Items</a></li>
                    <li class="nav-item"><a class="nav-link" href="matches.html">Matches</a></li>
                </ul>
                <ul class="navbar-nav" id="authNav"></ul>
            </div>
        </div>
    </nav>

    <div class="container">

        <!-- Search Filters -->
        <div class="card shadow mb-4">
            <div class="card-body">
                <form onsubmit="searchItems(event)">
                    <div class="form-row align-items-end">
                        <div class="col-md-5 mb-3 mb-md-0">
                            <label class="sr-only">Keyword</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <div class="input-group-text"><i class="fas fa-search"></i></div>
                                </div>
                                <input type="text" class="form-control" id="searchInput"
                                    placeholder="Search by name, location, or description...">
                            </div>
                        </div>
                        <div class="col-md-3 mb-3 mb-md-0">
                            <select class="form-control" id="filterCategory">
                                <option value="">All Categories</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Documents">Documents</option>
                                <option value="Bags">Bags</option>
                                <option value="Keys">Keys</option>
                                <option value="Clothing">Clothing</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-2 mb-3 mb-md-0">
                            <select class="form-control" id="filterType">
                                <option value="all">All Items</option>
                                <option value="lost">Lost Items</option>
                                <option value="found">Found Items</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary btn-block">Search</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search Results -->
        <div class="row" id="searchResults">
            <div class="col-12 text-center text-muted mt-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Loading items...</p>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=2"></script>
</body>

</html>
